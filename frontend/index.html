<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrobot Test - Редактор кампаний</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #333; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; }
        .btn-add { background-color: #28a745; }
        .btn-add:hover { background-color: #218838; }
        .btn-remove { background-color: #dc3545; }
        .btn-remove:hover { background-color: #c82333; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h1>Редактор кампаний</h1>

    <div class="card">
        <label for="campaignSelect">Выберите кампанию:</label>
        <select id="campaignSelect">
            <option value="">-- Загрузка кампаний... --</option>
        </select>

        <label for="offerId">ID оффера:</label>
        <input type="number" id="offerId" placeholder="Например, 18814">

        <div class="btn-group">
            <button class="btn-add" onclick="updateOffer('add')">Добавить оффер</button>
            <button class="btn-remove" onclick="updateOffer('remove')">Удалить оффер</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // Базовый URL вашего API. Если фронтенд открывается не через localhost:8001, укажите нужный.
        const API_URL = 'http://localhost:8001';

        // 1. Загружаем список кампаний при открытии страницы
        async function loadCampaigns() {
            const select = document.getElementById('campaignSelect');
            try {
                const response = await fetch(`${API_URL}/api/campaigns`);
                if (!response.ok) throw new Error('Ошибка загрузки кампаний');
                const campaigns = await response.json();
                
                select.innerHTML = '<option value="">-- Выберите кампанию --</option>';
                campaigns.forEach(camp => {
                    const option = document.createElement('option');
                    option.value = camp.id;
                    option.textContent = `${camp.id} - ${camp.name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                select.innerHTML = '<option value="">Ошибка загрузки</option>';
                showStatus('Не удалось загрузить список кампаний. Проверьте подключение к API.', 'error');
            }
        }

        // 2. Функция для добавления или удаления оффера
        async function updateOffer(action) {
            const campaignId = document.getElementById('campaignSelect').value;
            const offerId = document.getElementById('offerId').value;

            if (!campaignId) {
                showStatus('Пожалуйста, выберите кампанию.', 'error');
                return;
            }
            if (!offerId) {
                showStatus('Пожалуйста, введите ID оффера.', 'error');
                return;
            }

            const payload = {
                action: action,
                offer_id: parseInt(offerId)
            };

            try {
                const response = await fetch(`${API_URL}/api/campaigns/${campaignId}/offers`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(data.message, 'success');
                    document.getElementById('offerId').value = ''; // Очищаем поле
                } else {
                    showStatus(data.detail || 'Произошла ошибка при обновлении.', 'error');
                }
            } catch (error) {
                showStatus('Ошибка сети. Проверьте, запущен ли сервер.', 'error');
            }
        }

        // 3. Вспомогательная функция для отображения сообщений
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
            
            // Скрываем сообщение через 5 секунд
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        // Запускаем загрузку при старте
        window.onload = loadCampaigns;
    </script>
</body>
</html>
